[project]
name = "eleos"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.3",
    "razorpay>=1.4.1",
    "web3>=6.15.1",
    "eth-account>=0.11.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "reportlab>=4.1.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
